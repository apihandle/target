<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · TARGET</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#eef0f3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .logo{width:56px;height:56px;border-radius:50%;background:#f2994a;color:#1a1205;display:grid;place-items:center;font-weight:900;font-size:24px}
  p{color:#9aa1ac;max-width:22rem;line-height:1.5;font-size:14px}
  button{margin-top:8px;height:40px;padding:0 20px;border:0;border-radius:999px;background:#f2994a;color:#1a1205;font-weight:600;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">◎</div>
  <h1 style="font-size:20px;margin:16px 0 4px">You're offline</h1>
  <p>TARGET needs a connection to load your chats and tasks. Nothing is lost; try again when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
