# TARGET worker on Render: New > Blueprint > pick this repo. Then add SESSION_WORKER_SECRET (same as Vercel).
services:
  - type: worker
    name: target-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    plan: starter
    envVars:
      - key: SESSION_WORKER_SECRET
        sync: false
      - key: TARGET_URL
        value: https://gettarget.vercel.app
  # Optional: separate compute worker for code + video jobs (off unless COMPUTE_WORKER_SECRET is set on Vercel too).
  - type: worker
    name: target-compute
    runtime: docker
    dockerfilePath: ./worker/compute/Dockerfile
    dockerContext: ./worker
    plan: starter
    envVars:
      - key: COMPUTE_WORKER_SECRET
        sync: false
      - key: TARGET_URL
        value: https://gettarget.vercel.app
