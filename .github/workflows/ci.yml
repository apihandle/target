name: CI

# Lint, type-check, unit tests and a production build on every push / PR to main.
# Uses placeholder env only (no secrets): the build never talks to Supabase or any AI provider.
on:
  push:
    branches: [main, "wip/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint src
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx next build
