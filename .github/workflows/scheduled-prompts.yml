# Vercel's free cron runs only once a day, so reminders and every-N-hours prompts would be late.
# This free GitHub Actions job calls the same protected endpoint every 10 minutes (GitHub may run scheduled
# jobs less often than asked when it is busy).
# Setup: repo Settings > Secrets and variables > Actions > add CRON_SECRET (same value as on Vercel).
# A run turns red only for a setup problem (missing or wrong CRON_SECRET, server key missing); a slow or busy
# server just logs a warning, so a red run always means something to fix.
name: Scheduled prompts
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run due prompts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET is not set in the repo's Actions secrets"; exit 1; fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer $CRON_SECRET" https://gettarget.vercel.app/api/cron/scheduled || true)
          cat out.json 2>/dev/null; echo; echo "HTTP $code"
          case "$code" in
            2*) ;;
            401|403) echo "::error::CRON_SECRET here doesn't match the one on Vercel"; exit 1 ;;
            503) echo "::error::Server setup incomplete (CRON_SECRET or SUPABASE_SERVICE_ROLE_KEY missing on Vercel)"; exit 1 ;;
            *) echo "::warning::Scheduled prompts endpoint answered $code" ;;
          esac
      - name: Run queued browser jobs (built-in cloud worker)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 100 -H "Authorization: Bearer $CRON_SECRET" https://gettarget.vercel.app/api/browser-jobs/run || true)
          cat out.json 2>/dev/null; echo; echo "HTTP $code"
          case "$code" in
            2*) ;;
            401|403) echo "::error::CRON_SECRET here doesn't match the one on Vercel"; exit 1 ;;
            503) echo "::warning::Browser worker not configured on Vercel (SESSION_WORKER_SECRET)" ;;
            *) echo "::warning::Browser jobs endpoint answered $code" ;;
          esac
