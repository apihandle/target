# Daily "For you" scan (Gmail + Calendar offers on Home) at about 7:30 AM IST.
# Three calls 20 minutes apart so every user gets scanned (each call handles a few users).
name: For you scan
on:
  schedule:
    - cron: "0,20,40 2 * * *"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --max-time 70 -H "Authorization: Bearer $CRON_SECRET" https://gettarget.vercel.app/api/cron/proactive || true
