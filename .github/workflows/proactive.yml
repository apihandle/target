# Daily "For you" scan (Gmail + Calendar offers on Home) at about 7:30 AM IST.
# Three calls 20 minutes apart so every user gets scanned (each call handles a few users).
# A run turns red only for a setup problem (missing or wrong CRON_SECRET, server key missing).
name: For you scan
on:
  schedule:
    - cron: "0,20,40 2 * * *"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET is not set in the repo's Actions secrets"; exit 1; fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer $CRON_SECRET" https://gettarget.vercel.app/api/cron/proactive || true)
          cat out.json 2>/dev/null; echo; echo "HTTP $code"
          case "$code" in
            2*) ;;
            401|403) echo "::error::CRON_SECRET here doesn't match the one on Vercel"; exit 1 ;;
            503) echo "::error::Server setup incomplete (CRON_SECRET or SUPABASE_SERVICE_ROLE_KEY missing on Vercel)"; exit 1 ;;
            *) echo "::warning::For you scan endpoint answered $code" ;;
          esac
