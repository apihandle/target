name: Android

# Compiles the TARGET Android assistant (target-app/) and runs its unit tests.
# No APK is built or uploaded by this job (user rule). No secrets are used.
on:
  push:
    paths:
      - "target-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "target-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: target-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); make sure platform 36 + build-tools are there.
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: target-app/app/libs
          key: sherpa-onnx-aar-2.0.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile (no APK) + unit tests
        run: ./gradlew --no-daemon --stacktrace compileDebugSources compileDebugUnitTestKotlin testDebugUnitTest
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: target-app/app/build/reports/tests/
          if-no-files-found: ignore
